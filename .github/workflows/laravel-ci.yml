name: Laravel CI — backend-laravel

on:
  push:
    branches: ["main", "master"]
    paths:
      - "backend-laravel/**"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "backend-laravel/**"

defaults:
  run:
    working-directory: backend-laravel

jobs:
  laravel-ci:
    name: PHP ${{ matrix.php }} — Pint + Larastan + Pest
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2"]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: plaxtilineas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, bcmath, pdo, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend-laravel/vendor
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('backend-laravel/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: "Pint: verificar estilo de codigo"
        run: vendor/bin/pint --test

      - name: "Larastan: analisis estatico nivel 6"
        run: vendor/bin/phpstan analyse --level=6 --memory-limit=512M

      - name: "Pest: suite de tests (SQLite en memoria)"
        run: vendor/bin/pest --parallel --ci
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

  # Job separado para tests con MySQL real (opcional, solo en push a main)
  laravel-mysql-tests:
    name: Tests con MySQL
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: plaxtilineas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, pdo, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: plaxtilineas_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Run tests with MySQL
        run: vendor/bin/pest --ci
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: plaxtilineas_test
          DB_USERNAME: root
          DB_PASSWORD: root
