<div class="carousel-main">
  <!-- Header with Nav -->
  <div class="carousel-header">
    <div class="header-info">
      <span class="small-tag">Catálogo</span>
      <h2 class="carousel-title">Más <span>{{ categoriaNombre }}</span></h2>
    </div>
    
    <div class="nav-controls">
      <button class="nav-btn prev" (click)="movePrev()" [disabled]="isAtStart">
        <fa-icon [icon]="['fas', 'chevron-left']"></fa-icon>
      </button>
      <button class="nav-btn next" (click)="moveNext()" [disabled]="isAtEnd">
        <fa-icon [icon]="['fas', 'chevron-right']"></fa-icon>
      </button>
    </div>
  </div>

  <!-- Loading State (Skeleton) -->
  <div *ngIf="cargando" class="carousel-viewport" style="overflow: hidden;">
    <div class="carousel-track">
      <div class="carousel-item" *ngFor="let i of [1, 2, 3, 4]">
        <div class="product-mini-card skeleton-card">
          <div class="mini-img-box skeleton-box"></div>
          <div class="mini-info">
            <div class="skeleton-text skeleton-title"></div>
            <div class="skeleton-text skeleton-price"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Error o Vacío -->
  <div *ngIf="!cargando && error" class="carousel-error">
    <p>{{ error }}</p>
  </div>
  <div *ngIf="!cargando && !error && productos.length === 0" class="carousel-error info">
    <p>No hay productos disponibles en esta categoría.</p>
  </div>

  <!-- Viewport -->
  <div *ngIf="!cargando && !error && productos.length > 0" class="carousel-viewport" #carouselViewport (scroll)="onScroll()" (wheel)="onWheel($event)">
    <div class="carousel-track">
      <div class="carousel-item" *ngFor="let producto of productos; let i = index">
        <div class="product-mini-card" [routerLink]="['/producto', producto.id]">
          <div class="mini-img-box">
            <!-- Badges Decorativos (Simulados basados en ID) -->
            <div class="product-badges">
              <span class="badge badge-new" *ngIf="producto.id % 6 === 0">Nuevo</span>
            </div>
            <!-- Tags (Promocionales) -->
            <span *ngIf="producto.controlar_stock && producto.stock === 0" class="tag promo agotado" style="background-color: #ef4444 !important; color: white !important; font-weight: bold; bottom: 8px; right: 8px;">Agotado</span>
            <span *ngIf="!(producto.controlar_stock && producto.stock === 0) && i % 4 === 0" class="tag promo descuento-15">15% descuento</span>
            <span *ngIf="!(producto.controlar_stock && producto.stock === 0) && i % 4 === 1" class="tag promo ultimas-unidades">Últimas unidades</span>
            <span *ngIf="!(producto.controlar_stock && producto.stock === 0) && i % 4 === 2" class="tag promo descuento-50">50% descuento</span>
            <span *ngIf="!(producto.controlar_stock && producto.stock === 0) && i % 4 === 3" class="tag promo promo-dia">Promo del día</span>
            <img [src]="producto.imagen_url" [alt]="producto.nombre">
          </div>
          <div class="mini-info">
            <h5>{{ producto.nombre }}</h5>
            <span class="mini-price">$ {{ producto.precio | number }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Scroll Indicator -->
  <div *ngIf="!cargando && !error && productos.length > 0" class="scroll-indicator">
    <div class="indicator-bar" [style.width.%]="scrollProgress"></div>
  </div>
</div>
