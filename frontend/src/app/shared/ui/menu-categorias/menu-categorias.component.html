<nav class="menu-categorias" aria-label="Categorías de productos">
  <!-- Header Bento Minimal -->
  <div class="menu-header">
    <div class="menu-title-wrap">
      <span class="menu-accent-bar" aria-hidden="true"></span>
      <h2 class="menu-title">Categorías</h2>
    </div>
    <div class="menu-header-actions">
      <button
        *ngIf="hasExpandedCategories"
        type="button"
        class="collapse-all-btn"
        (click)="cerrarTodasLasCategorias()"
        title="Cerrar todas las subcategorías abiertas"
        aria-label="Cerrar todas las subcategorías abiertas">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="17 11 12 6 7 11"></polyline>
          <polyline points="17 18 12 13 7 18"></polyline>
        </svg>
        <span>Cerrar</span>
      </button>
      <span class="categorias-total-badge" *ngIf="!cargandoCategorias && categorias.length > 0">
        {{ categorias.length }}
      </span>
    </div>
  </div>

  <!-- Botón Todos los Productos -->
  <div class="menu-all-wrap">
    <button
      type="button"
      class="ver-todos-btn"
      [class.active]="mostrarTodosProductos"
      (click)="verTodosProductos()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
        <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
        <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
        <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
      </svg>
      <span>Todos los productos</span>
    </button>
  </div>

  <!-- Skeletons minimalistas -->
  <div class="categorias-container" *ngIf="cargandoCategorias">
    <div class="categoria-skeleton" *ngFor="let i of [1,2,3,4,5,6,7,8]">
      <div class="skeleton-cat-dot"></div>
      <div class="skeleton-cat-name"></div>
    </div>
  </div>

  <!-- Lista de Categorías -->
  <div class="categorias-container" *ngIf="!cargandoCategorias">
    <div
      *ngFor="let cat of categorias"
      class="categoria"
      [id]="'cat-' + cat.id"
      [class.expanded]="cat.expanded"
      [class.selected]="activeCategoryId === cat.id">
      <button
        type="button"
        class="categoria-btn"
        (click)="toggle(cat)"
        [attr.aria-expanded]="cat.expanded">
        <div class="categoria-content">
          <span class="categoria-dot" aria-hidden="true"></span>
          <span class="categoria-nombre">{{ cat.nombre }}</span>
          <span class="categoria-count" *ngIf="cat.cantidad && cat.cantidad > 0">{{ cat.cantidad }}</span>
        </div>

        <span class="flecha-indicadora" [class.abierta]="cat.expanded" *ngIf="cat.subcategorias && cat.subcategorias.length > 0" aria-hidden="true">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </span>
      </button>

      <!-- Subcategorías en árbol minimalista -->
      <div class="subcategorias-wrapper" [class.abierta]="cat.expanded" *ngIf="cat.subcategorias && cat.subcategorias.length > 0">
        <ul class="subcategorias">
          <li *ngFor="let sub of cat.subcategorias" class="subcategoria-item">
            <button
              type="button"
              class="subcategoria-btn"
              [class.active]="activeSubcategoryId === sub.id"
              (click)="seleccionarSubcategoria(sub.id)">
              <span class="subcategoria-nombre">{{ sub.nombre }}</span>
              <span class="subcategoria-count" *ngIf="sub.cantidad !== undefined && sub.cantidad > 0">
                {{ sub.cantidad }}
              </span>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </div>
</nav>
