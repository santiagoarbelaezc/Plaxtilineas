<!-- src/app/components/login-form/login-form.component.html -->
<div class="flex justify-center items-center min-h-screen bg-[#0f1420] p-5 font-sans relative overflow-hidden">
  <!-- Elementos decorativos (Dark Premium) -->
  <div class="absolute -top-[200px] -right-[200px] w-[500px] height-[500px] bg-[radial-gradient(circle,rgba(54,140,68,0.15)_0%,transparent_70%)] rounded-full pointer-events-none z-0"></div>
  <div class="absolute -bottom-[150px] -left-[150px] w-[400px] height-[400px] bg-[radial-gradient(circle,rgba(37,211,102,0.1)_0%,transparent_70%)] rounded-full pointer-events-none z-0"></div>

  <div class="w-full max-w-[420px] bg-[#1e293b] rounded-2xl p-[60px_40px] shadow-[0_10px_40px_rgba(0,0,0,0.5)] border border-white/5 relative z-10 animate-slideInUp md:p-[50px_30px] sm:p-[40px_25px]">
    <div class="block h-auto">
      
      <!-- Sección del formulario -->
      <div class="p-0 flex flex-col justify-center overflow-visible">
        <div class="mb-10 text-center">
          <h2 class="text-[1.8rem] font-bold text-white mb-2 tracking-[0.2px] relative inline-block after:content-[''] after:block after:w-[60px] after:h-[3px] after:bg-gradient-to-r after:from-[#368c44] after:to-[#25d366] after:mx-auto after:mt-4 after:rounded-[2px] md:text-[1.6rem] sm:text-[1.5rem]">
            Iniciar Sesión
          </h2>
          <p class="text-[#94a3b8] text-[0.85rem] font-light tracking-[0.5px] uppercase mt-3 sm:text-[0.8rem]">
            Ingresa tus credenciales para acceder
          </p>
        </div>

        <!-- ── Banner sesión expirada ── -->
        <div *ngIf="sessionExpired" class="session-expired-banner">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          Tu sesión expiró. Inicia sesión nuevamente.
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="w-full flex flex-col gap-6">
          <div class="relative flex flex-col gap-2">
            <label for="correo" class="flex items-center gap-2 text-[0.9rem] font-medium text-[#e2e8f0] tracking-[0.2px] sm:text-[0.85rem]">
              <span class="inline-flex items-center text-[#368c44]">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
              </span>
              Correo electrónico
            </label>
            <input 
              id="correo" 
              formControlName="correo" 
              type="email" 
              placeholder="ejemplo@correo.com"
              required
              class="w-full p-[12px_14px] text-[0.95rem] bg-[#0f1420]/50 border border-white/10 rounded-lg transition-all duration-300 ease-[cubic-bezier(0.4,0,0.2,1)] text-white focus:outline-none focus:border-[#368c44] focus:bg-[#0f1420] focus:shadow-[0_0_0_3px_rgba(54,140,68,0.2)] placeholder:text-[#64748b] placeholder:text-[0.9rem] sm:p-[10px_12px] sm:text-[0.9rem]"
            >
          </div>

          <div class="relative flex flex-col gap-2">
            <label for="password" class="flex items-center gap-2 text-[0.9rem] font-medium text-[#e2e8f0] tracking-[0.2px] sm:text-[0.85rem]">
              <span class="inline-flex items-center text-[#368c44]">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              Contraseña
            </label>
            <div class="relative w-full">
              <input 
                id="password" 
                formControlName="password" 
                [type]="showPassword ? 'text' : 'password'" 
                placeholder="••••••••"
                required
                class="w-full p-[12px_14px] pr-12 text-[0.95rem] bg-[#0f1420]/50 border border-white/10 rounded-lg transition-all duration-300 ease-[cubic-bezier(0.4,0,0.2,1)] text-white focus:outline-none focus:border-[#368c44] focus:bg-[#0f1420] focus:shadow-[0_0_0_3px_rgba(54,140,68,0.2)] placeholder:text-[#64748b] placeholder:text-[0.9rem] sm:p-[10px_12px] sm:text-[0.9rem]"
              >
              <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#94a3b8] hover:text-[#368c44] hover:scale-110 active:scale-95 transition-all duration-200 z-10 flex items-center justify-center p-2" (click)="togglePasswordVisibility()" [title]="showPassword ? 'Ocultar contraseña' : 'Ver contraseña'">
                <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="w-full p-[12px_24px] bg-[rgba(54,140,68,0.2)] text-[#4ade80] border border-[rgba(54,140,68,0.4)] rounded-lg text-[0.95rem] font-semibold cursor-pointer flex items-center justify-center gap-2 transition-all duration-300 ease-[cubic-bezier(0.4,0,0.2,1)] mt-2 shadow-none relative overflow-hidden group hover:not-disabled:-translate-y-[2px] hover:not-disabled:shadow-[0_0_15px_rgba(54,140,68,0.4)] hover:not-disabled:bg-[#368c44] hover:not-disabled:text-white active:translate-y-0 disabled:bg-white/5 disabled:text-white/30 disabled:border-white/10 disabled:cursor-not-allowed sm:p-[11px_16px] sm:text-[0.9rem]">
            <span class="relative z-10">Ingresar</span>
            <span class="inline-flex items-center transition-transform duration-300 group-hover:translate-x-[3px] scale-110 relative z-10">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
              </svg>
            </span>
          </button>
        </form>

        <div class="mt-6 text-center">
          <a routerLink="/productos" class="inline-flex items-center gap-[6px] w-full p-[12px_24px] bg-transparent border border-white/10 rounded-lg text-[#94a3b8] no-underline text-[0.95rem] font-normal transition-all duration-300 ease-[cubic-bezier(0.4,0,0.2,1)] justify-center mt-2 group hover:bg-white/5 hover:border-white/20 hover:text-white sm:p-[11px_16px] sm:text-[0.9rem]">
            <span class="inline-flex items-center transition-transform duration-300 group-hover:-translate-x-[3px]">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
              </svg>
            </span>
            Regresar a Productos
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal de Error: Aparece cuando fallan las credenciales o los campos están vacíos -->
<div class="fixed inset-0 w-full h-full bg-[#0f172a]/80 backdrop-blur-md flex items-center justify-center z-[9999] animate-fadeInModal" *ngIf="showErrorModal" (click)="closeErrorModal()">
  <div class="bg-[#1e293b] border border-white/10 w-[90%] max-w-[380px] p-8 rounded-[28px] shadow-[0_25px_50px_-12px_rgba(0,0,0,0.5)] flex flex-col items-center text-center animate-modalSlideUp" (click)="$event.stopPropagation()">
    <div class="mb-5">
      <div class="w-16 h-16 bg-gradient-to-br from-[#ef4444] to-[#dc2626] rounded-full flex items-center justify-center shadow-[0_10px_20px_-3px_rgba(239,68,68,0.5)]">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </div>
    </div>
    <div class="mb-7">
      <h3 class="text-[1.4rem] font-bold text-white mb-3">Atención</h3>
      <p class="text-[0.95rem] text-[#cbd5e1] leading-relaxed m-0">{{ errorMsg }}</p>
    </div>
    <div class="w-full">
      <button class="w-full p-3.5 bg-[#368c44] text-white border-none rounded-[14px] font-semibold text-base cursor-pointer transition-all duration-200 hover:bg-[#25d366] hover:-translate-y-[2px] hover:shadow-[0_8px_20px_rgba(54,140,68,0.4)]" (click)="closeErrorModal()">Entendido</button>
    </div>
  </div>
</div>
