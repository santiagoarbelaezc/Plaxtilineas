<!-- src/app/components/login-form/login-form.component.html -->
<div class="flex justify-center items-center min-h-screen bg-[#0f1420] p-5 font-sans relative overflow-hidden">
  <!-- Elementos decorativos (Dark Premium) -->
  <div class="absolute -top-[200px] -right-[200px] w-[500px] height-[500px] bg-[radial-gradient(circle,rgba(54,140,68,0.15)_0%,transparent_70%)] rounded-full pointer-events-none z-0"></div>
  <div class="absolute -bottom-[150px] -left-[150px] w-[400px] height-[400px] bg-[radial-gradient(circle,rgba(37,211,102,0.1)_0%,transparent_70%)] rounded-full pointer-events-none z-0"></div>

  <div class="w-full max-w-[500px] bg-[#1e293b] rounded-2xl p-[50px_40px] shadow-[0_10px_40px_rgba(0,0,0,0.5)] border border-white/5 relative z-10 animate-slideInUp md:p-[40px_30px] sm:p-[30px_20px]">
    
    <!-- Header -->
    <div class="mb-8 text-center">
      <div class="flex justify-center gap-4 mb-6">
        <button 
          (click)="mode = 'login'" 
          class="text-[1.2rem] font-bold tracking-[0.2px] pb-2 border-b-2 transition-all duration-300"
          [class.text-white]="mode === 'login'"
          [class.border-[#368c44]]="mode === 'login'"
          [class.text-[#64748b]]="mode === 'register'"
          [class.border-transparent]="mode === 'register'">
          Ingresar
        </button>
        <button 
          (click)="toggleMode()" 
          class="text-[1.2rem] font-bold tracking-[0.2px] pb-2 border-b-2 transition-all duration-300"
          [class.text-white]="mode === 'register'"
          [class.border-[#368c44]]="mode === 'register'"
          [class.text-[#64748b]]="mode === 'login'"
          [class.border-transparent]="mode === 'login'">
          Registrarse
        </button>
      </div>
      <p class="text-[#94a3b8] text-[0.85rem] font-light tracking-[0.5px] uppercase mt-2 sm:text-[0.8rem]">
        {{ mode === 'login' ? 'Ingresa tus credenciales para acceder' : 'Crea tu cuenta para acceder a ofertas VIP' }}
      </p>
    </div>

    <!-- Banner sesión expirada -->
    <div *ngIf="sessionExpired && mode === 'login'" class="session-expired-banner bg-yellow-500/10 border border-yellow-500/20 text-yellow-500 p-3 rounded-lg flex items-center gap-2 mb-6 text-sm">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      Tu sesión expiró. Inicia sesión nuevamente.
    </div>

    <!-- Google SSO -->
    <div class="flex justify-center mb-6">
      <div id="google-btn-login"></div>
    </div>
    <div class="flex items-center text-center text-[#64748b] text-sm mb-6">
      <div class="flex-1 border-b border-white/10"></div>
      <span class="px-4">o con tu correo</span>
      <div class="flex-1 border-b border-white/10"></div>
    </div>

    <!-- LOGIN FORM -->
    <form *ngIf="mode === 'login'" [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="w-full flex flex-col gap-5">
      <div class="flex flex-col gap-2">
        <label class="text-[0.85rem] font-medium text-[#e2e8f0]">Correo electrónico</label>
        <input formControlName="correo" type="email" placeholder="ejemplo@correo.com" class="w-full p-[12px_14px] text-[0.95rem] bg-[#0f1420]/50 border border-white/10 rounded-lg text-white focus:outline-none focus:border-[#368c44] placeholder:text-[#64748b]">
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-[0.85rem] font-medium text-[#e2e8f0]">Contraseña</label>
        <div class="relative">
          <input formControlName="password" [type]="showPassword ? 'text' : 'password'" placeholder="••••••••" class="w-full p-[12px_14px] pr-12 text-[0.95rem] bg-[#0f1420]/50 border border-white/10 rounded-lg text-white focus:outline-none focus:border-[#368c44] placeholder:text-[#64748b]">
          <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#94a3b8] hover:text-[#368c44]" (click)="togglePasswordVisibility()">
            Ver
          </button>
        </div>
      </div>

      <button type="submit" [disabled]="isSubmitting" class="w-full p-[12px] bg-[#368c44] hover:bg-[#2d7a39] text-white rounded-lg font-semibold transition-all mt-2 disabled:opacity-50">
        {{ isSubmitting ? 'Cargando...' : 'Ingresar' }}
      </button>
    </form>

    <!-- REGISTER FORM -->
    <form *ngIf="mode === 'register'" [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="w-full flex flex-col gap-4">
      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1">
          <label class="text-[0.8rem] text-[#e2e8f0]">Nombres</label>
          <input formControlName="nombre" type="text" class="p-[10px] text-[0.9rem] bg-[#0f1420]/50 border border-white/10 rounded-lg text-white focus:border-[#368c44]">
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-[0.8rem] text-[#e2e8f0]">Apellidos</label>
          <input formControlName="apellidos" type="text" class="p-[10px] text-[0.9rem] bg-[#0f1420]/50 border border-white/10 rounded-lg text-white focus:border-[#368c44]">
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-[0.8rem] text-[#e2e8f0]">Correo electrónico</label>
        <input formControlName="correo" type="email" class="p-[10px] text-[0.9rem] bg-[#0f1420]/50 border border-white/10 rounded-lg text-white focus:border-[#368c44]">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1">
          <label class="text-[0.8rem] text-[#e2e8f0]">Teléfono</label>
          <input formControlName="telefono" type="tel" class="p-[10px] text-[0.9rem] bg-[#0f1420]/50 border border-white/10 rounded-lg text-white focus:border-[#368c44]">
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-[0.8rem] text-[#e2e8f0]">Edad</label>
          <input formControlName="edad" type="number" class="p-[10px] text-[0.9rem] bg-[#0f1420]/50 border border-white/10 rounded-lg text-white focus:border-[#368c44]">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1">
          <label class="text-[0.8rem] text-[#e2e8f0]">Ciudad</label>
          <input formControlName="ciudad" type="text" class="p-[10px] text-[0.9rem] bg-[#0f1420]/50 border border-white/10 rounded-lg text-white focus:border-[#368c44]">
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-[0.8rem] text-[#e2e8f0]">Dirección</label>
          <input formControlName="direccion" type="text" class="p-[10px] text-[0.9rem] bg-[#0f1420]/50 border border-white/10 rounded-lg text-white focus:border-[#368c44]">
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-[0.8rem] text-[#e2e8f0]">Contraseña Segura</label>
        <div class="relative">
          <input formControlName="password" [type]="showPassword ? 'text' : 'password'" placeholder="Min. 8 caracteres, mayúscula y número" class="w-full p-[10px] pr-12 text-[0.9rem] bg-[#0f1420]/50 border border-white/10 rounded-lg text-white focus:border-[#368c44]">
          <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#94a3b8]" (click)="togglePasswordVisibility()">Ver</button>
        </div>
        <small class="text-red-400 text-xs mt-1" *ngIf="pwdCtrl?.invalid && pwdCtrl?.touched">
          Debe tener al menos 8 caracteres, una mayúscula y un número.
        </small>
      </div>

      <button type="submit" [disabled]="isSubmitting" class="w-full p-[12px] bg-[#368c44] hover:bg-[#2d7a39] text-white rounded-lg font-semibold transition-all mt-2 disabled:opacity-50">
        {{ isSubmitting ? 'Procesando...' : 'Crear Cuenta' }}
      </button>
    </form>

    <!-- Regresar -->
    <div class="mt-6 text-center">
      <a routerLink="/productos" class="inline-block text-[#94a3b8] text-[0.9rem] hover:text-white transition-colors">
        ← Regresar a Productos
      </a>
    </div>

  </div>
</div>

<!-- Modal Error -->
<div class="fixed inset-0 w-full h-full bg-[#0f172a]/80 backdrop-blur-md flex items-center justify-center z-[9999]" *ngIf="showErrorModal" (click)="closeErrorModal()">
  <div class="bg-[#1e293b] border border-white/10 w-[90%] max-w-[380px] p-8 rounded-2xl text-center" (click)="$event.stopPropagation()">
    <h3 class="text-xl font-bold text-white mb-2">Atención</h3>
    <p class="text-[#cbd5e1] mb-6">{{ errorMsg }}</p>
    <button class="w-full p-3 bg-[#368c44] hover:bg-[#25d366] text-white rounded-xl font-semibold" (click)="closeErrorModal()">Entendido</button>
  </div>
</div>
