<div class="chat-overlay" (click)="onClose()">
  <div class="chat-window" (click)="$event.stopPropagation()">
    <!-- Header -->
    <header class="chat-header">
      <div class="assistant-info">
        <div class="avatar-container">
          <img src="assets/images/mateo5.png" alt="Mateo" class="header-avatar">
          <span class="status-dot"></span>
        </div>
        <div class="text-info">
          <h3>Mateo</h3>
          <span>Asistente IA • Online</span>
        </div>
      </div>
      <div class="header-actions" style="display: flex; gap: 8px;">
        <button class="reload-btn" (click)="reiniciarChat()" title="Reiniciar conversación" aria-label="Reiniciar conversación">↻</button>
        <button class="close-btn" (click)="onClose()" aria-label="Cerrar chat">×</button>
      </div>
    </header>

    <!-- Messages Area -->
    <div class="chat-messages" #scrollMe>
      
      <!-- Welcome Hero Section -->
      <div class="welcome-hero">
        <img src="assets/images/mateo5.png" alt="Mateo Asistente" class="large-mateo">
        <div class="welcome-text">
          <h2>Hola, Soy <span>Mateo</span></h2>
          <p>
            Tu asistente personal de Plaxtilineas.<br>
            ¿Qué buscas? ¿Qué producto necesitas?<br>
            <strong>¡Yo te ayudo!</strong>
          </p>
        </div>
      </div>

      <!-- Messages Loop -->
      <div *ngFor="let msg of messages" [class]="'message-wrapper ' + msg.sender">
        <div class="message-bubble">
          <div class="bubble-text">{{ msg.text }}</div>
          
          <!-- Productos Recomendados -->
          <div class="recommended-products" *ngIf="msg.productos && msg.productos.length > 0">
            <div class="product-mini-card" *ngFor="let prod of msg.productos" (click)="navegarA('/producto/' + prod.id)">
              <img [src]="prod.imagen || 'assets/images/placeholder.jpg'" [alt]="prod.nombre" class="prod-thumb">
              <div class="prod-details">
                <span class="prod-name">{{ prod.nombre }}</span>
                <span class="prod-price">{{ prod.precio | currency:'USD':'symbol':'1.0-0' }}</span>
              </div>
              <button class="prod-view-btn">Ver</button>
            </div>
          </div>

          <!-- Botones de Acción / Enlaces -->
          <div class="action-buttons-list" *ngIf="msg.links && msg.links.length > 0">
            <button 
              *ngFor="let link of msg.links" 
              class="quick-action-btn" 
              (click)="navegarA(link.url, link.external)">
              {{ link.label }}
            </button>
          </div>

          <span class="message-time">{{ msg.timestamp | date:'HH:mm' }}</span>
        </div>
      </div>

      <!-- Typing Indicator -->
      <div class="message-wrapper assistant" *ngIf="isTyping">
        <div class="message-bubble typing">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <footer class="chat-footer">
      <form (ngSubmit)="sendMessage()" class="input-form">
        <input 
          type="text" 
          [(ngModel)]="newMessage" 
          name="message" 
          placeholder="Escribe tu mensaje aquí..."
          autocomplete="off">
        <button type="submit" [disabled]="!newMessage.trim()" class="send-btn">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
          </svg>
        </button>
      </form>
    </footer>
  </div>
</div>
