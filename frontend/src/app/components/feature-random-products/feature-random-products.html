<section class="feature-new-products-section categories-section">
  <div class="container">
    <!-- Section Header -->
    <div class="section-header">
      <h2 class="section-title">Recomendados <span>Para Ti</span></h2>
      <p class="section-subtitle">Descubre otros productos destacados de nuestro catálogo</p>
    </div>

    <!-- Carousel Container -->
    <div class="carousel-wrapper" *ngIf="!loading && productos.length > 0">
      <!-- Prev Button -->
      <button class="nav-btn prev" (click)="scrollCarrusel('prev')" aria-label="Anterior">
        <fa-icon [icon]="['fas', 'chevron-left']"></fa-icon>
      </button>
      
      <div class="carousel-viewport">
        <div class="categories-grid products-carousel-grid" #productosGrid (scroll)="onScroll($event)">
          <!-- Product Card -->
          <div class="category-item" *ngFor="let producto of productos">
            
            <div class="category-card product-card-styled" (click)="verDetalles(producto.id, producto.nombre)">
              
              <div class="card-visual">
                <img 
                  [src]="producto.imagen_url || 'assets/placeholder.jpg'" 
                  [alt]="producto.nombre"
                  class="category-icon product-image"
                  loading="lazy"
                  (error)="producto.imagen_url = 'assets/images/default-product.png'"
                >
                <div class="card-overlay"></div>
              </div>

              <div class="card-content product-info">
                <span class="product-subcategory">{{producto.categoria}}</span>
                <h3 class="product-title">{{producto.nombre}}</h3>
                <div class="product-price">
                  <span class="price-amount">{{ formatearPrecio(producto.precio) }}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Next Button -->
      <button class="nav-btn next" (click)="scrollCarrusel('next')" aria-label="Siguiente">
        <fa-icon [icon]="['fas', 'chevron-right']"></fa-icon>
      </button>
    </div>
    
    <!-- Indicators -->
    <div class="carousel-indicators" *ngIf="!loading && pagesArray.length > 1">
      <button class="indicator-dot" 
              *ngFor="let page of pagesArray"
              [class.active]="currentPage === page"
              (click)="goToPage(page)"
              aria-label="Ir a página"></button>
    </div>

    <!-- Loading template -->
    <div class="loading-container" *ngIf="loading">
      <img src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1766281904/Logo_fovu78c_djnblz.png" alt="Plaxtilineas Logo" class="loading-logo">
      <p>Cargando productos recomendados...</p>
    </div>
    
    <!-- Empty State -->
    <div class="empty-state" *ngIf="!loading && productos.length === 0">
      <div class="empty-icon">
        <fa-icon [icon]="['fas', 'box-open']"></fa-icon>
      </div>
      <h3>Próximamente más productos</h3>
      <p>Estamos trabajando para traer nuevas opciones al catálogo.</p>
    </div>

    <!-- Botón para ver todos los productos -->
    <div class="view-all-container" *ngIf="!loading && productos.length > 0">
      <button class="view-all-btn" (click)="verTodosProductos()">
        Ver Todos los Productos
        <span class="arrow-icon">→</span>
      </button>
    </div>
  </div>
</section>
