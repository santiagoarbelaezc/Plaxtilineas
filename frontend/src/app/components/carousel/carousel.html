<div class="carousel-main">
  <!-- Header with Nav -->
  <div class="carousel-header">
    <div class="header-info">
      <span class="small-tag">Catálogo</span>
      <h2 class="carousel-title">Más <span>{{ categoriaNombre }}</span></h2>
    </div>
    
    <div class="nav-controls">
      <button class="nav-btn prev" (click)="movePrev()" [disabled]="isAtStart">
        <fa-icon [icon]="['fas', 'chevron-left']"></fa-icon>
      </button>
      <button class="nav-btn next" (click)="moveNext()" [disabled]="isAtEnd">
        <fa-icon [icon]="['fas', 'chevron-right']"></fa-icon>
      </button>
    </div>
  </div>

  <!-- Viewport -->
  <div class="carousel-viewport" #carouselViewport>
    <div class="carousel-track" [style.transform]="getTransform()">
      <div class="carousel-item" *ngFor="let producto of productos">
        <div class="product-mini-card" [routerLink]="['/producto', producto.id]">
          <div class="mini-img-box">
            <img [src]="producto.imagen_url" [alt]="producto.nombre">
          </div>
          <div class="mini-info">
            <h5>{{ producto.nombre }}</h5>
            <span class="mini-price">$ {{ producto.precio | number }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Scroll Indicator -->
  <div class="scroll-indicator">
    <div class="indicator-bar" [style.width.%]="scrollProgress"></div>
  </div>
</div>
