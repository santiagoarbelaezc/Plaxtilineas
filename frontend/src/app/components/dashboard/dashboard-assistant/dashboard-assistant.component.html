<!-- Botón flotante arrastrable (FAB) con tonalidades rojas de Dashboard -->
<button
  class="assistant-fab"
  [class.hidden]="isOpen"
  [class.dragging]="isDragging"
  [style.right.px]="positionRight"
  [style.bottom.px]="positionBottom"
  (mousedown)="onMouseDown($event)"
  (touchstart)="onTouchStart($event)"
  (click)="onFabClick($event)"
  title="Abrir Asistente Mateo"
  draggable="false"
  aria-label="Abrir asistente Mateo">

  <!-- Anillo pulsante en rojo -->
  <span class="fab-pulse-ring"></span>

  <div class="fab-avatar-container" draggable="false">
    <div class="fab-bot-icon">
      <!-- Icono Vectorial Moderno de IA / Bot -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2 2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"></path>
        <rect x="3" y="8" width="18" height="12" rx="4"></rect>
        <circle cx="8" cy="14" r="1.5" fill="currentColor"></circle>
        <circle cx="16" cy="14" r="1.5" fill="currentColor"></circle>
        <path d="M10 18h4"></path>
      </svg>
    </div>
    <span class="status-dot-red"></span>
  </div>

  <!-- Tooltip flotante conciso -->
  <div class="fab-tooltip">
    <span class="tooltip-spark">✨</span> Asistente Mateo
  </div>
</button>

<!-- Panel de Chat Flotante — Estilo Contacto Asistente con Tonalidades Rojas -->
<div class="assistant-panel" [class.open]="isOpen">

  <!-- Línea Superior de Resplandor Rojo (Estilo Dashboard Plaxtilineas) -->
  <div class="chat-accent-glow"></div>

  <!-- Cabecera Minimalista y Limpia -->
  <header class="chat-header">
    <div class="assistant-info">
      <div class="header-avatar-bot">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2 2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"></path>
          <rect x="3" y="8" width="18" height="12" rx="4"></rect>
          <circle cx="8" cy="14" r="1.5" fill="currentColor"></circle>
          <circle cx="16" cy="14" r="1.5" fill="currentColor"></circle>
          <path d="M10 18h4"></path>
        </svg>
      </div>
      <div class="text-info">
        <div class="title-with-badge">
          <h3>Mateo</h3>
          <span class="admin-badge">IA</span>
        </div>
        <span class="online-label">
          <span class="status-pulse-dot"></span>
          En línea
        </span>
      </div>
    </div>

    <div class="header-actions">
      <button class="action-btn" (click)="reiniciarChat()" title="Reiniciar chat" aria-label="Reiniciar conversación">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
        </svg>
      </button>
      <button class="action-btn close-btn" (click)="closeChat()" title="Cerrar chat" aria-label="Cerrar chat">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Cuerpo de Mensajes -->
  <div class="chat-messages" #chatContainer>

    <!-- Welcome Hero Compacto (Texto Reducido) -->
    <div class="welcome-hero" *ngIf="messages.length <= 1">
      <div class="hero-bot-badge">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2 2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"></path>
          <rect x="3" y="8" width="18" height="12" rx="4"></rect>
          <circle cx="8" cy="14" r="1.5" fill="currentColor"></circle>
          <circle cx="16" cy="14" r="1.5" fill="currentColor"></circle>
          <path d="M10 18h4"></path>
        </svg>
      </div>

      <h2 class="welcome-heading">
        <span class="title-lead">Mateo Admin</span>
        <span class="title-highlight">¿Qué deseas consultar hoy?</span>
      </h2>
    </div>

    <!-- Quick Replies (Consultas Rápidas en Píldora con Iconos Vectoriales Nítidos) -->
    <div class="quick-replies-section" *ngIf="showQuickReplies && messages.length <= 1">
      <p class="quick-replies-label">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="#dc2626" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="label-icon">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        ACCESOS RÁPIDOS
      </p>

      <div class="quick-replies-grid">
        <!-- Stock Bajo -->
        <button class="quick-reply-btn" (click)="sendQuickReply('Stock bajo')" [disabled]="moderation.isBlocked" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.29 7 12 12 20.71 7"></polyline>
            <line x1="12" y1="22" x2="12" y2="12"></line>
          </svg>
          <span>Stock bajo</span>
        </button>

        <!-- Más Vendidos -->
        <button class="quick-reply-btn" (click)="sendQuickReply('Más vendidos')" [disabled]="moderation.isBlocked" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
            <polyline points="17 6 23 6 23 12"></polyline>
          </svg>
          <span>Más vendidos</span>
        </button>

        <!-- Pedidos -->
        <button class="quick-reply-btn" (click)="sendQuickReply('Pedidos')" [disabled]="moderation.isBlocked" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span>Pedidos</span>
        </button>

        <!-- Usuarios -->
        <button class="quick-reply-btn" (click)="sendQuickReply('Usuarios')" [disabled]="moderation.isBlocked" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>Usuarios</span>
        </button>

        <!-- Categorías -->
        <button class="quick-reply-btn" (click)="sendQuickReply('Categorías')" [disabled]="moderation.isBlocked" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
            <line x1="7" y1="7" x2="7.01" y2="7"></line>
          </svg>
          <span>Categorías</span>
        </button>

        <!-- PQR -->
        <button class="quick-reply-btn" (click)="sendQuickReply('PQR')" [disabled]="moderation.isBlocked" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>PQR</span>
        </button>
      </div>
    </div>

    <!-- Lista de Mensajes -->
    <div *ngFor="let msg of messages"
         [class]="'message-wrapper ' + msg.sender + (msg.type ? ' type-' + msg.type : '')">
      <div class="message-bubble"
           [class.bubble-warning]="msg.type === 'warning'"
           [class.bubble-error]="msg.type === 'error'">
        <div class="bubble-text" style="white-space: pre-line;">{{ msg.text }}</div>

        <!-- Meta de mensaje -->
        <div class="message-meta">
          <span class="message-time">{{ msg.timestamp | date:'HH:mm' }}</span>
          <span class="message-ticks" *ngIf="msg.sender === 'user'">
            <svg width="12" height="12" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </span>
        </div>
      </div>
    </div>

    <!-- Indicador de Escritura -->
    <div class="message-wrapper assistant" *ngIf="isTyping">
      <div class="message-bubble typing">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <!-- Banner de Moderación / Bloqueo -->
  <div class="chat-blocked-banner" *ngIf="moderation.isBlocked">
    <svg width="15" height="15" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
    <span>Chat restringido — reactiva en <strong>{{ moderation.blockCountdown }}s</strong></span>
  </div>

  <!-- Footer / Entrada de Mensaje Concisa -->
  <footer class="chat-footer" [class.blocked]="moderation.isBlocked">
    <form (ngSubmit)="sendMessage()" class="input-form">
      <div class="input-wrapper">
        <input
          #messageInput
          type="text"
          [(ngModel)]="newMessage"
          name="message"
          [placeholder]="moderation.isBlocked ? 'Chat restringido...' : 'Escribe tu consulta...'"
          autocomplete="off"
          [disabled]="moderation.isBlocked"
          [maxlength]="maxChars">
        <button type="submit" [disabled]="!newMessage.trim() || moderation.isBlocked" class="send-btn" aria-label="Enviar">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
          </svg>
        </button>
      </div>

      <!-- Contador de caracteres -->
      <div class="footer-meta" *ngIf="newMessage.length > 0">
        <span class="char-counter" [ngClass]="charCountClass">{{ charCount }}/{{ maxChars }}</span>
      </div>
    </form>
  </footer>

</div>
