<div class="promo-card" 
     [routerLink]="linkUrl"
     [queryParams]="queryParams"
     (click)="onNavigate()"
     [style.cursor]="tieneNavegacion() ? 'pointer' : 'default'">
  
  <!-- Media Layer -->
  <div class="card-media">
    <img [src]="imagen" [alt]="titulo" class="promo-image">
    <div class="media-overlay"></div>
    
    <!-- Optional Logo -->
    <div *ngIf="logoUrl" class="brand-logo">
      <img [src]="logoUrl" alt="Brand Logo">
    </div>
  </div>

  <!-- Content Layer -->
  <div class="card-body" [class.no-content]="shouldBeTransparent()">
    <div class="info-box">
      <div class="badge">Oferta Especial</div>
      <h3 class="promo-title">{{ titulo }}</h3>
      <p class="promo-description">{{ descripcion }}</p>
      
      <button class="cta-button">
        Explorar Ahora
        <fa-icon [icon]="['fas', 'chevron-right']"></fa-icon>
      </button>
    </div>
  </div>
</div>
