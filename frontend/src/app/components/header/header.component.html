<header class="hero-section" *ngIf="mostrarHeader">
  <!-- Video Background -->
  <div class="video-container">
    <video
      #headerVideo
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      class="video-bg"
    >
      <source src="assets/videos/plaxtilineas.mp4" type="video/mp4" />
    </video>
    <div class="video-overlay"></div>
  </div>

  <div class="container hero-container">
    <div class="hero-grid">
      <!-- Left: Brand/Logo (Premium) -->
      <div class="hero-visual">
        <div class="logo-wrapper">
          <img src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1759851398/Logo_fovu7c.png" alt="Plaxtilineas" class="hero-logo">
        </div>
      </div>

      <!-- Right: Content -->
      <div class="hero-text">
        <h1 class="hero-title">
          Expertos en <span>Plásticos</span> <br>
          & Soluciones de <span>Empaque</span>
        </h1>
        <p class="hero-description">
          Distribuidor líder de peletería, espumas y empaques en <strong>Armenia</strong>. 
          Calidad e innovación adaptadas a tus proyectos más exigentes.
        </p>
        
        <div class="hero-actions">
          <a routerLink="/productos" class="btn-premium primary">
            <fa-icon [icon]="['fas', 'shopping-cart']"></fa-icon>
            <span>Ver Catálogo</span>
          </a>
          <a routerLink="/nosotros" class="btn-premium secondary">
            <fa-icon [icon]="['fas', 'users']"></fa-icon>
            <span>Conócenos</span>
          </a>
          <a routerLink="/contacto" class="btn-premium glass">
            <fa-icon [icon]="['fas', 'envelope']"></fa-icon>
            <span>Contacto</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
