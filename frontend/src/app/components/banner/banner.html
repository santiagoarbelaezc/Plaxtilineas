<section class="plaxti-banner-section">
  <div class="container" *ngIf="showHeader">
    <!-- Section Header -->
    <div class="section-header">
      <div class="section-kicker">
        <span class="kicker-pulse"></span>
        <span>Catálogo Integral</span>
      </div>
      <h2 class="section-title" [innerHTML]="headerTitle"></h2>
      <p class="section-subtitle" *ngIf="headerSubtitle">{{ headerSubtitle }}</p>
    </div>
  </div>

  <div [ngClass]="{'container': !fullWidth, 'full-width-container': fullWidth}">
    <!-- Contenedor del banner -->
    <div 
      class="plaxti-banner-container"
      [style.height]="height"
    >
      <!-- Grid de imágenes -->
      <div class="plaxti-banner-grid" [ngClass]="{'has-gap': !fullWidth, 'has-hover': hoveredIndex !== null}">
        <!-- Tarjetas dinámicas -->
        <div 
          *ngFor="let image of images; let i = index"
          class="plaxti-image-wrapper"
          [class.is-hovered]="hoveredIndex === i"
          [style]="getImageStyle(i)"
          (mouseenter)="onMouseEnter(i)"
          (mouseleave)="onMouseLeave()"
          (click)="onClick(image)"
          [class.clickable]="image.link"
        >
          <div class="plaxti-image-container">
            <img 
              [src]="image.url" 
              [alt]="image.alt"
              class="plaxti-banner-image"
              loading="eager"
            />
            
            <!-- Metadata superior (Categoría y número de tarjeta) -->
            <div class="plaxti-top-meta">
              <span class="plaxti-card-badge" *ngIf="image.category">
                {{ image.category }}
              </span>
              <span class="plaxti-card-index">0{{ i + 1 }}</span>
            </div>

            <!-- Overlays degradados para máxima legibilidad -->
            <div class="plaxti-image-overlay"></div>
            <div class="plaxti-gradient-overlay" *ngIf="showGradient"></div>
            
            <!-- Contenido superpuesto -->
            <div *ngIf="image.title || image.description" class="plaxti-image-content">
              <div class="content-wrapper">
                <!-- Título -->
                <h3 *ngIf="image.title" class="plaxti-image-title">{{ image.title }}</h3>
                
                <!-- Descripción -->
                <p *ngIf="image.description" class="plaxti-image-description">{{ image.description }}</p>
                
                <!-- Botón de acción -->
                <div *ngIf="image.link" class="plaxti-image-actions">
                  <button class="plaxti-action-btn" type="button">
                    <span>{{ image.link === '/contacto' ? 'Hablar con Asesor' : 'Ver Productos' }}</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                      <line x1="5" y1="12" x2="19" y2="12"></line>
                      <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                  </button>
                </div>
              </div>
            </div>

            <!-- Borde resplandor activo -->
            <div class="plaxti-card-glow"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
