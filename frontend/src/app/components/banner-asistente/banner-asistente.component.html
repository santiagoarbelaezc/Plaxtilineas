<section class="assistant-banner">
  <div class="banner-container">
    
    <!-- Left: Content -->
    <div class="content-side">
      <div class="badge-new">Nuevo</div>
      <h2 class="title">Mateo <span>Asistente IA</span></h2>
      <p class="description">
        Pregunta, habla con él, él te va a ayudar <br>
        a encontrar lo que necesitas.
      </p>
      
      <button class="cta-chat" (click)="abrirChat()">
        <span>Hablar con Mateo</span>
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
        </svg>
      </button>
    </div>

    <!-- Right: Visual -->
    <div class="visual-side">
      <div class="blob-bg"></div>
      <img src="assets/images/mateo2.png" alt="Mateo Asistente" class="mateo-image">
      
      <!-- Floating decorative elements - ACTUALIZADO -->
      <div class="floating-card c1">¿Cómo puedo ayudarte?</div>
      <div class="floating-card c2">Cotiza tus productos</div>
    </div>

  </div>
</section>
