<section class="assistant-banner">
  <div class="banner-container">

    <!-- Left: Content -->
    <div class="content-side">
      <div class="badge-new">Asistente IA</div>
      <h2 class="title">Cotiza tus <span>productos</span></h2>
      <p class="description">
        ¿Cómo puedo ayudarte? <br>
        Habla con nuestro asistente inteligente y encuentra<br>
        exactamente lo que necesitas al mejor precio.
      </p>

      <div class="chat-pills">
        <span class="pill"><fa-icon [icon]="faComments" class="pill-icon"></fa-icon> Cotizar productos</span>
        <span class="pill"><fa-icon [icon]="faBoxOpen" class="pill-icon"></fa-icon> Ver disponibilidad</span>
        <span class="pill"><fa-icon [icon]="faTruck" class="pill-icon"></fa-icon> Consultar envíos</span>
      </div>

      <button class="cta-chat" (click)="abrirChat()">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
        </svg>
        <span>Hablar con el Asistente</span>
      </button>
    </div>

    <!-- Right: Visual — logo IA centrado -->
    <div class="visual-side">
      <div class="ia-logo-wrapper">
        <img src="assets/images/logo-ia.png" alt="Asistente IA" class="ia-logo-image">
      </div>
    </div>

  </div>
</section>
