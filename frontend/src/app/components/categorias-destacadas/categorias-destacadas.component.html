<section id="categoriasDestacadas" class="categories-section">
  <div class="container">
    <!-- Section Header -->
    <div class="section-header">
      <h2 class="section-title">Nuestras <span>Categorías</span></h2>
      <p class="section-subtitle">Soluciones integrales en plásticos y empaques para cada sector</p>
    </div>

    <!-- Carousel Container -->
    <div class="carousel-wrapper" *ngIf="categorias.length > 0">
      <!-- Prev Button -->
      <button class="nav-btn prev" (click)="scrollCarrusel('prev')" aria-label="Anterior">
        <fa-icon [icon]="['fas', 'chevron-left']"></fa-icon>
      </button>
      
      <div class="carousel-viewport">
        <div class="categories-grid" #categoriasGrid>
          <!-- Category Card -->
          <div class="category-item" *ngFor="let cat of categorias; let i = index">
            
            <a [routerLink]="['/productos']"
               [queryParams]="{ subcategoria_id: obtenerPrimeraSubcategoria(cat.id) }"
               class="category-card"
               (click)="onCategoriaClick(cat)">
              
              <div class="card-visual">
                <img [src]="cat.icono_url" 
                     [alt]="cat.nombre"
                     class="category-icon"
                     (error)="handleImageError($event, cat)">
                <div class="card-overlay"></div>
              </div>

              <div class="card-content">
                <h3>{{ cat.nombre }}</h3>
                <span class="explore-text">Explorar <fa-icon [icon]="['fas', 'chevron-right']"></fa-icon></span>
              </div>
            </a>
          </div>
        </div>
      </div>
      
      <!-- Next Button -->
      <button class="nav-btn next" (click)="scrollCarrusel('next')" aria-label="Siguiente">
        <fa-icon [icon]="['fas', 'chevron-right']"></fa-icon>
      </button>
    </div>
    
    <!-- Indicators -->
    <div class="carousel-indicators" *ngIf="pagesArray.length > 1">
      <button class="indicator-dot" 
              *ngFor="let page of pagesArray"
              [class.active]="currentPage === page"
              (click)="goToPage(page)"
              aria-label="Ir a página"></button>
    </div>
    
    <!-- Empty State -->
    <div class="empty-state" *ngIf="categorias.length === 0">
      <div class="empty-icon">
        <fa-icon [icon]="['fas', 'folder-open']"></fa-icon>
      </div>
      <h3>Próximamente nuevas categorías</h3>
      <p>Estamos trabajando para ampliar nuestro catálogo y ofrecerte más opciones.</p>
    </div>
  </div>
</section>
