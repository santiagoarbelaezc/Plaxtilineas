<app-loading-screen [isVisible]="isLoading"></app-loading-screen>
<div class="main-app-content">
  <router-outlet></router-outlet>
</div>
<app-cart-drawer></app-cart-drawer>
<app-mobile-cart></app-mobile-cart>
<app-toast-notification></app-toast-notification>

<!-- Pantalla de Cierre de Sesión Completa -->
<div class="logout-fullscreen-overlay" *ngIf="authService.isLoggingOut | async"
     [ngClass]="(themeService.theme$ | async) === 'dark' ? 'logout-dark' : 'logout-light'">
  <div class="logout-fullscreen-content">
    
    <!-- Logo con halo de brillo cálido -->
    <div class="logout-logo-container">
      <img src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1766281904/Logo_fovu78c_djnblz.png" alt="Plaxtilineas" class="logout-logo">
      <div class="logout-logo-glow"></div>
    </div>

    <!-- Checkmark SVG Animado -->
    <div class="logout-checkmark-wrapper">
      <svg class="logout-checkmark-svg" viewBox="0 0 52 52">
        <circle class="logout-checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
        <path class="logout-checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
      </svg>
    </div>

    <!-- Mensajes de Cierre de Sesión -->
    <div class="logout-text-container">
      <h2 class="logout-title">¡Sesión Cerrada!</h2>
      <p class="logout-subtitle">Gracias por visitar Plaxtilineas. ¡Vuelve pronto!</p>
    </div>

    <!-- Barra de progreso -->
    <div class="logout-progress-bar-container">
      <div class="logout-progress-bar"></div>
    </div>

    <p class="logout-status-text">Cerrando sesión de forma segura...</p>
  </div>
</div>


<!-- Install Prompt for Android/PC -->
<div *ngIf="canInstall$ | async" class="fixed bottom-0 left-0 right-0 z-[100] bg-blue-600 text-white p-4 shadow-lg flex justify-between items-center transform transition-transform duration-300 sm:bottom-4 sm:left-auto sm:right-4 sm:rounded-xl sm:w-80">
  <div>
    <h3 class="font-bold text-sm">Instala nuestra App</h3>
    <p class="text-xs opacity-90">Acceso rápido a nuestros productos.</p>
  </div>
  <button (click)="installPwa()" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-medium text-sm hover:bg-blue-50 transition-colors shadow">
    Instalar
  </button>
</div>
