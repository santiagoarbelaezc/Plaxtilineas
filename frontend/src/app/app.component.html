<app-loading-screen [isVisible]="isLoading"></app-loading-screen>
<router-outlet></router-outlet>
<app-cart-drawer></app-cart-drawer>


<!-- Install Prompt for Android/PC -->
<div *ngIf="canInstall$ | async" class="fixed bottom-0 left-0 right-0 z-[100] bg-blue-600 text-white p-4 shadow-lg flex justify-between items-center transform transition-transform duration-300 sm:bottom-4 sm:left-auto sm:right-4 sm:rounded-xl sm:w-80">
  <div>
    <h3 class="font-bold text-sm">Instala nuestra App</h3>
    <p class="text-xs opacity-90">Acceso rápido a nuestros productos.</p>
  </div>
  <button (click)="installPwa()" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-medium text-sm hover:bg-blue-50 transition-colors shadow">
    Instalar
  </button>
</div>

<!-- Manual iOS Prompt -->
<div *ngIf="isIos$ | async" class="fixed bottom-0 left-0 right-0 z-[100] bg-gray-900 border-t border-gray-800 text-white p-4 shadow-[0_-10px_40px_rgba(0,0,0,0.3)] pb-safe animate-fade-in-up">
  <div class="max-w-md mx-auto flex items-center gap-4">
    <div class="bg-gray-800 p-2 rounded-xl flex-shrink-0">
      <!-- iOS Share Icon -->
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-400">
        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
        <polyline points="16 6 12 2 8 6"></polyline>
        <line x1="12" y1="2" x2="12" y2="15"></line>
      </svg>
    </div>
    <p class="text-sm">
      Para instalar la App: Presiona compartir y luego <span class="font-bold text-white">"Agregar a Inicio"</span>.
    </p>
  </div>
</div>
