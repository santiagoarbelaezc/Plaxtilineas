<div class="banner-card">
  <div class="banner-image">
    <img [src]="imagenUrl" [alt]="altText" class="bg-image">
    <div class="banner-overlay"></div>
  </div>

  <div class="banner-content">
    <div class="content-box">
      <span class="banner-tag">Recomendado</span>
      <h2 class="banner-title">{{ titulo }}</h2>
      <p class="banner-description">{{ descripcion }}</p>
      
      <div class="banner-footer">
        <span class="price-from">Desde Armenia para el Quindío</span>
        <div class="badge-premium">Premium Quality</div>
      </div>
    </div>
  </div>
</div>
