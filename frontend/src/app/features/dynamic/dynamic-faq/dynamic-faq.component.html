<section class="faq-section">
  <div class="container">
    <div class="section-header" *ngIf="contenido?.titulo || contenido?.subtitulo">
      <h2 class="section-title" *ngIf="contenido?.titulo">{{ contenido.titulo }}</h2>
      <p class="section-subtitle" *ngIf="contenido?.subtitulo">{{ contenido.subtitulo }}</p>
      <div class="title-underline"></div>
    </div>

    <!-- Barra de Búsqueda -->
    <div class="search-container">
      <div class="search-input-wrapper">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          [(ngModel)]="searchText" 
          placeholder="Busca respuestas a tus dudas..." 
          class="search-input">
      </div>
    </div>

    <!-- Lista de Acordeones -->
    <div class="faq-list" *ngIf="listPreguntas.length > 0; else emptyState">
      <div 
        class="faq-item" 
        *ngFor="let item of listPreguntas" 
        [class.open]="item.isOpen">
        
        <button class="faq-trigger" (click)="toggleItem(item)">
          <span class="faq-question">{{ item.pregunta }}</span>
          <span class="faq-icon-wrapper">
            <svg class="faq-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </span>
        </button>

        <div class="faq-content">
          <div class="faq-content-inner">
            <p class="faq-answer">{{ item.respuesta }}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Estado vacío de búsqueda -->
    <ng-template #emptyState>
      <div class="faq-empty-state">
        <div class="empty-icon">🔍</div>
        <h4>No encontramos resultados</h4>
        <p>Intenta buscar con otros términos o escríbenos directamente.</p>
      </div>
    </ng-template>
  </div>
</section>
