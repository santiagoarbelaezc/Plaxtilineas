<section class="galeria-section" *ngIf="listImagenes.length > 0">
  <div class="container">
    <div class="section-header" *ngIf="contenido?.titulo || contenido?.subtitulo">
      <h2 class="section-title" *ngIf="contenido?.titulo">{{ contenido.titulo }}</h2>
      <p class="section-subtitle" *ngIf="contenido?.subtitulo">{{ contenido.subtitulo }}</p>
      <div class="title-underline"></div>
    </div>

    <!-- Grilla de Imágenes -->
    <div class="galeria-grid">
      <div 
        class="galeria-item" 
        *ngFor="let img of listImagenes; let i = index" 
        (click)="openLightbox(i)">
        <div class="image-wrapper">
          <img [src]="img.url" [alt]="img.caption || 'Imagen de Galería'" class="galeria-img" loading="lazy">
          <div class="item-overlay">
            <span class="zoom-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                <line x1="11" y1="8" x2="11" y2="14"></line>
                <line x1="8" y1="11" x2="14" y2="11"></line>
              </svg>
            </span>
            <p class="overlay-caption" *ngIf="img.caption">{{ img.caption }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div class="lightbox" *ngIf="lightboxOpen" (click)="closeLightbox()">
    <button class="lightbox-close" (click)="closeLightbox()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <!-- Botón Anterior -->
    <button class="lightbox-nav prev" (click)="prevImage($event)" *ngIf="listImagenes.length > 1">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <!-- Contenedor de la Imagen Activa -->
    <div class="lightbox-content" (click)="$event.stopPropagation()">
      <img [src]="activeImage?.url" [alt]="activeImage?.caption || 'Imagen ampliada'" class="lightbox-img">
      <div class="lightbox-caption" *ngIf="activeImage?.caption">
        <p>{{ activeImage?.caption }}</p>
      </div>
    </div>

    <!-- Botón Siguiente -->
    <button class="lightbox-nav next" (click)="nextImage($event)" *ngIf="listImagenes.length > 1">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>
</section>
