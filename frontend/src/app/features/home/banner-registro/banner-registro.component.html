<section class="banner-registro-section">
  <div class="banner-registro-container">
    
    <!-- Lado Izquierdo: Información sintética y limpia -->
    <div class="banner-info-group">

      <div class="banner-text-wrap">
        <h2 class="banner-title">
          Únete gratis y obtén hasta <span class="highlight-accent">20% OFF</span>
        </h2>
        <p class="banner-subtitle">
          Precios especiales de distribuidor en espumas, plásticos y empaques.
        </p>
      </div>

      <div class="banner-perks-inline">
        <span class="perk-chip">
          <svg class="perk-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12" />
          </svg>
          Registro en 1 min
        </span>
        <span class="perk-chip">
          <svg class="perk-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12" />
          </svg>
          100% Gratis
        </span>
      </div>
    </div>

    <!-- Lado Derecho: Llamado a la acción -->
    <div class="banner-cta-group">
      <button class="banner-btn" (click)="goToRegister()" aria-label="Registrarme gratis">
        <span>Registrarme gratis</span>
        <svg class="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>

  </div>
</section>
