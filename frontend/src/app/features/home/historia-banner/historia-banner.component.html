<section class="historia-banner-section" aria-label="Conoce nuestra historia - Plaxtilineas">
  <div class="historia-container">
    <div class="historia-bento-card">

      <!-- Columna Izquierda: Identidad & Logo -->
      <div class="historia-brand-panel">
        <img
          [src]="logoUrl"
          alt="Plaxtilineas"
          class="historia-logo"
          loading="lazy" />
        <span class="historia-origin-tag">Armenia, Quindío &bull; Eje Cafetero</span>
      </div>

      <!-- Separador sutil -->
      <div class="historia-divider" aria-hidden="true"></div>

      <!-- Columna Central: Mensaje de Historia -->
      <div class="historia-copy">
        <span class="historia-kicker">
          <span class="kicker-line"></span>
          TRADICIÓN &amp; CONFIANZA
        </span>
        <h2 class="historia-title">
          Conoce <span class="title-green">nuestra historia</span>
        </h2>
        <p class="historia-desc">
          Nacimos en Armenia como una empresa familiar dedicada a la distribución de insumos para marroquinería, tapicería, construcción, hogar y agricultura. Hoy combinamos cercanía humana con innovación regional.
        </p>
      </div>

      <!-- Columna Derecha: CTA -->
      <div class="historia-action">
        <a routerLink="/nosotros" class="historia-cta-btn">
          <span>Conocer más</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>
      </div>

    </div>
  </div>
</section>
