<section class="identity-showcase-section" aria-label="¿Qué hacemos? - Plaxtilineas">
  <div class="identity-container">
    <div class="identity-grid">
      
      <!-- Columna Izquierda: Imagen Showcase de Gran Formato -->
      <div class="showcase-visual-wrapper">
        <div class="showcase-frame">
          <img 
            [src]="showcaseImage.url" 
            [alt]="showcaseImage.alt"
            class="showcase-img"
            loading="lazy">
        </div>
      </div>

      <!-- Columna Derecha: Contenido Editorial con Efecto Typewriter -->
      <div class="identity-content-wrapper">
        
        <!-- Kicker Minimalista: ¿QUÉ HACEMOS? -->
        <div class="kicker-badge-row">
          <span class="identity-kicker">
            <span class="kicker-line"></span>
            ¿QUÉ HACEMOS?
          </span>
        </div>

        <!-- Gran Titular con Efecto Typewriter Preservado -->
        <div class="headline-container">
          <h2 class="identity-title">
            <span class="title-lead-line">Materiales y plásticos</span>
            <span class="title-dynamic-line">
              <span class="typewriter-text">{{ displayedText }}</span><span class="typewriter-cursor">|</span>
            </span>
          </h2>
        </div>

        <!-- Párrafo Descriptivo Conciso y Directo -->
        <p class="identity-lead">
          En <strong>Plaxtilineas</strong> distribuimos espumas industriales, plásticos técnicos, mallas y empaques para fincas, obras, talleres y empresas del Eje Cafetero.
        </p>

        <!-- Lista de Ejes Principales con Textos Reducidos y Enlaces -->
        <ul class="identity-checklist">
          <li *ngFor="let eje of ejesPrincipales" class="checklist-item">
            <a 
              [routerLink]="eje.link" 
              [queryParams]="eje.queryParams"
              (click)="limpiarFiltros()"
              class="checklist-link">
              <!-- Checkmark SVG -->
              <svg class="check-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <!-- Texto -->
              <span class="eje-text-group">
                <strong class="eje-name">{{ eje.nombre }}:</strong>
                <span class="eje-detail">{{ eje.detalle }}</span>
              </span>
              <!-- Flecha Sutil en Hover -->
              <svg class="hover-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </a>
          </li>
        </ul>

        <!-- Botón de Acción Principal -->
        <div class="identity-action-row">
          <a 
            routerLink="/productos" 
            (click)="limpiarFiltros()"
            class="identity-cta-pill">
            <span>VER CATÁLOGO COMPLETO</span>
          </a>
        </div>

      </div>

    </div>
  </div>
</section>
