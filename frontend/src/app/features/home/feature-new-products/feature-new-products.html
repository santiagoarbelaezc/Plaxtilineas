<section class="feature-new-products-section">
  <div class="container">
    
    <!-- Header de Sección con Design Tokens -->
    <div class="section-header">
      <h2 class="section-title">
        {{ title }} <span class="highlight-green">{{ titleHighlight }}</span>
      </h2>
      <p class="section-subtitle">
        {{ subtitle }}
      </p>
    </div>

    <!-- Carrusel de Productos -->
    <div class="carrusel-wrapper" *ngIf="!loading && productos.length > 0">
      
      <!-- Botón Anterior -->
      <button 
        class="carrusel-btn prev-btn" 
        (click)="scrollCarrusel('prev')" 
        [disabled]="currentPage === 0"
        aria-label="Anterior">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <div class="carousel-viewport">
        <div class="productos-grid" #productosGrid (scroll)="onScroll($event)">
          
          <!-- Tarjeta de Producto -->
          <div *ngFor="let producto of productos; let i = index; trackBy: trackByProductoId" class="producto-card">
            
            <div class="producto-imagen-wrapper" (click)="verDetalles(producto.id, producto.nombre)">
              <img [src]="producto.imagen_url ? optimizarImagen(producto.imagen_url) : 'assets/images/placeholder.jpg'" 
                   [alt]="producto.nombre" 
                   class="producto-imagen"
                   loading="lazy"
                   (error)="producto.imagen_url = 'assets/images/default-product.png'">
            </div>

            <div class="producto-info">
              <span class="product-subcategory" *ngIf="producto.categoria">{{ producto.categoria }}</span>
              <h3 class="producto-titulo" (click)="verDetalles(producto.id, producto.nombre)">
                {{ formatearNombre(producto.nombre) }}
              </h3>
              
              <div class="producto-precio-row">
                <span class="precio-tachado" *ngIf="producto.precio">{{ obtenerPrecioReferencia(producto.precio) }}</span>
                <span class="producto-precio">
                  {{ formatearPrecio(producto.precio) }}
                  <span class="precio-unidad">und</span>
                </span>
              </div>
            </div>

          </div>
        </div>
      </div>

      <!-- Botón Siguiente -->
      <button 
        class="carrusel-btn next-btn" 
        (click)="scrollCarrusel('next')" 
        [disabled]="currentPage >= pagesArray.length - 1"
        aria-label="Siguiente">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>

    </div>

    <!-- Indicadores -->
    <div class="carrusel-indicators" *ngIf="!loading && pagesArray.length > 1">
      <button *ngFor="let page of pagesArray" 
              class="indicator-dot" 
              [class.active]="currentPage === page"
              (click)="goToPage(page)"
              [attr.aria-label]="'Ir a página ' + (page + 1)">
      </button>
    </div>

    <!-- Skeleton Loader State (Carrusel Placeholder con Shimmer) -->
    <div class="carrusel-wrapper carrusel-skeleton-wrapper" *ngIf="loading" aria-busy="true" aria-label="Cargando productos">
      
      <!-- Botón Anterior Skeleton -->
      <div class="carrusel-btn prev-btn skeleton-nav-btn" aria-hidden="true">
        <div class="skeleton-shimmer"></div>
      </div>

      <div class="carousel-viewport">
        <div class="productos-grid skeleton-grid">
          
          <div *ngFor="let item of skeletonItems" class="producto-card skeleton-card">
            
            <div class="producto-imagen-wrapper skeleton-img-box">
              <div class="skeleton-shimmer"></div>
            </div>

            <div class="producto-info skeleton-info-box">
              <div class="skeleton-line skeleton-pill">
                <div class="skeleton-shimmer"></div>
              </div>
              <div class="skeleton-line skeleton-title-line">
                <div class="skeleton-shimmer"></div>
              </div>
              <div class="skeleton-line skeleton-title-line short">
                <div class="skeleton-shimmer"></div>
              </div>
              <div class="skeleton-line skeleton-price-line">
                <div class="skeleton-shimmer"></div>
              </div>
            </div>

          </div>

        </div>
      </div>

      <!-- Botón Siguiente Skeleton -->
      <div class="carrusel-btn next-btn skeleton-nav-btn" aria-hidden="true">
        <div class="skeleton-shimmer"></div>
      </div>

    </div>

    <!-- Indicadores Skeleton -->
    <div class="carrusel-indicators skeleton-indicators" *ngIf="loading" aria-hidden="true">
      <div class="indicator-dot skeleton-dot active"><div class="skeleton-shimmer"></div></div>
      <div class="indicator-dot skeleton-dot"><div class="skeleton-shimmer"></div></div>
      <div class="indicator-dot skeleton-dot"><div class="skeleton-shimmer"></div></div>
      <div class="indicator-dot skeleton-dot"><div class="skeleton-shimmer"></div></div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="!loading && productos.length === 0">
      <fa-icon [icon]="['fas', 'box-open']" class="empty-icon"></fa-icon>
      <h3>Próximamente nuevos productos</h3>
      <p>Estamos trabajando para traer nuevas opciones al catálogo.</p>
    </div>

    <!-- Botón para ver todos los productos -->
    <div class="view-all-container" *ngIf="!loading && productos.length > 0">
      <button class="view-all-btn" (click)="verTodosProductos()">
        <span>Ver Todos los Productos</span>
        <svg class="arrow-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>

  </div>
</section>
