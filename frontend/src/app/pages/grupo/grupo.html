<app-navbar></app-navbar>

<main class="grupo-page-wrapper" aria-label="Grupo Empresarial - Nuestras Marcas">

  <!-- Pista de Scroll Cinemática Estilo Car-Seat (3 Marcas) -->
  <div class="grupo-scroll-track" #scrollTrack>
    <div class="grupo-sticky-viewport">

      <!-- Escenario Visual Full-Width 100% con Interpolación 60 FPS -->
      <div class="grupo-fullbleed-stage" aria-hidden="true">
        <div
          *ngFor="let brand of brands; let i = index"
          class="stage-layer"
          [style.opacity]="layerStates[i]?.opacity ?? 0"
          [style.transform]="'scale(' + (layerStates[i]?.scale ?? 1) + ')'"
          [style.filter]="'blur(' + (layerStates[i]?.blur ?? 0) + 'px)'">
          <img
            [src]="brand.heroImage"
            [alt]="brand.name"
            class="fullbleed-brand-img" />
        </div>

        <!-- Scrim direccional limpio -->
        <div class="stage-scrim"></div>
      </div>

      <!-- Capa Editorial Minimalista -->
      <div class="grupo-overlay-inner">

        <!-- Contenido de Marca Activa (Transición suave estilo Car-Seat) -->
        <div class="grupo-brand-stage">
          <article
            *ngFor="let brand of brands; let i = index"
            class="brand-copy-layer"
            [class.active]="activeStage === i">

            <div class="brand-logo-wrap">
              <img
                [src]="brand.logo"
                [alt]="'Logo ' + brand.name"
                class="brand-png-logo" />
            </div>

            <h2 class="brand-title">{{ brand.name }}</h2>

            <p class="brand-desc">{{ brand.description }}</p>

            <div class="brand-actions">
              <a
                [href]="brand.websiteUrl"
                target="_blank"
                rel="noopener noreferrer"
                class="btn-visit-site"
                [title]="'Visitar sitio web oficial de ' + brand.name">
                <span>Visitar sitio web</span>
                <svg class="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="7" y1="17" x2="17" y2="7"></line>
                  <polyline points="7 7 17 7 17 17"></polyline>
                </svg>
              </a>
            </div>

          </article>
        </div>

        <!-- Barra Inferior Minimalista: Selector de Marcas + Flechas -->
        <div class="grupo-bottom-bar">
          <nav class="brand-tabs-nav" role="tablist" aria-label="Nuestras marcas">
            <button
              *ngFor="let brand of brands; let i = index"
              type="button"
              role="tab"
              class="brand-tab"
              [class.active]="activeStage === i"
              [attr.aria-selected]="activeStage === i"
              (click)="goToStage(i)">
              <span class="tab-num">0{{ i + 1 }}</span>
              <span>{{ brand.name }}</span>
            </button>
          </nav>

          <div class="grupo-subtle-arrows" aria-label="Navegar entre marcas">
            <button
              type="button"
              class="subtle-arrow"
              [disabled]="activeStage === 0"
              (click)="prevStage()"
              aria-label="Marca anterior">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </button>
            <button
              type="button"
              class="subtle-arrow"
              [disabled]="activeStage === brands.length - 1"
              (click)="nextStage()"
              aria-label="Marca siguiente">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>
        </div>

      </div>

    </div>
  </div>

</main>

<app-social-buttons></app-social-buttons>
<app-footer></app-footer>
