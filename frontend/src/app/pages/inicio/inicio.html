<app-navbar></app-navbar>

<main class="home-main">
  <!-- Hero Section -->
  <app-header></app-header>

  <!-- Categorías Destacadas -->
  <section class="home-section" id="categories">
    <app-categorias-destacadas></app-categorias-destacadas>
  </section>

  <!-- Banner de Asistente Mateo (REUBICADO) -->
  <app-banner-asistente></app-banner-asistente>

  <!-- Nosotros Inicio (Completo: Texto + Categorías) -->
  <section class="home-section intro-nosotros">
    <app-nosotros-inicio></app-nosotros-inicio>
  </section>

  <!-- Showcase de Producto -->
  <section class="home-section no-padding">
    <app-card-container
      [precio]="'$ 99.000'"
      [nombreProducto]="'Pisos Vinílicos'"
      [imagenProducto]="'https://res.cloudinary.com/dsv1gdgya/image/upload/v1767225513/card1_ipfxoo.jpg'"
      [categoriaNombre]="'Pisos'"
      [bannerImagenUrl]="'https://res.cloudinary.com/dsv1gdgya/image/upload/v1767297309/feature2-project_wypdpt.jpg'"
      [bannerTitulo]="'Pisos'"
      [bannerDescripcion]="'Pisos Vinílicos Plaxtilíneas. La combinación ideal entre diseño, resistencia y funcionalidad para hogares y espacios comerciales.'"
      [bannerAltText]="'Banner de pisos vinílicos'"
      [promoTitulo]="'ENVIOS A PARTIR DE $70.000'"
      [promoDescripcion]="'Ventas por mas de $70.000 envíos gratis a todo el Quindio'"
      [promoImagen]="'https://res.cloudinary.com/dsv1gdgya/image/upload/v1768884810/envio3_qatfoe.jpg'"
      [promoLogoUrl]="''"
      [linkUrl]="['/productos']"
      [promoQueryParams]="{ }"
      [cardLinkUrl]="['/productos']"
      [cardQueryParams]="{ subcategoria_id: 10 }">
    </app-card-container>
  </section>

  <!-- Grilla de Productos 1 -->
  <section class="home-section">
    <div class="container">
      <app-util-grid-producto></app-util-grid-producto>
    </div>
  </section>

  <!-- ════════════ ZONA DE COMPONENTES DINÁMICOS (Personalizable) ════════════ -->
  <ng-container *ngFor="let comp of componentesDinamicos">
    <div class="dynamic-wrapper">
      
      <!-- 1. TIPO BANNER DINÁMICO -->
      <div class="full-banner-container" *ngIf="comp.tipo === 'banner'">
        <app-full-banner
          [imageUrl]="comp.contenido?.imageUrl"
          [description]="comp.contenido?.descripcion"
          [vPosition]="'top'"
          [hPosition]="'left'"
          [linkUrl]="comp.contenido?.linkUrl">
        </app-full-banner>
      </div>

      <!-- 2. TIPO ANUNCIO (Novedad Elegante de la Semana) -->
      <section class="home-section" *ngIf="comp.tipo === 'anuncio'">
        <div class="elegant-news-container">
          <div class="elegant-news-card">
            <div class="news-image-wrapper">
              <img [src]="comp.contenido?.imageUrl" [alt]="comp.contenido?.titulo" class="news-img">
            </div>
            <div class="news-info-content">
              <span class="news-badge-weekly">⭐️ NOVEDAD DE LA SEMANA</span>
              <h3 class="news-card-title">{{ comp.contenido?.titulo }}</h3>
              <p class="news-card-desc">{{ comp.contenido?.texto }}</p>
              <a [routerLink]="comp.contenido?.linkUrl" class="news-card-link-btn">Descubrir más →</a>
            </div>
          </div>
        </div>
      </section>

      <!-- 3. TIPO TEXTO (Bloque de Texto Centrado o Lateral) -->
      <section class="home-section text-block-section" *ngIf="comp.tipo === 'texto'">
        <div class="container text-block-container" [style.text-align]="comp.contenido?.alineacion || 'center'">
          <h2 class="text-block-title">{{ comp.contenido?.titulo }}</h2>
          <p class="text-block-body">{{ comp.contenido?.cuerpo }}</p>
        </div>
      </section>

    </div>
  </ng-container>
  <!-- ════════════════════════════════════════════════════════════════════════ -->

  <!-- Carrusel de Banners -->
  <section class="home-section" id="soluciones">
    <app-plaxti-banner
      [images]="bannerImages"
      [height]="'500px'"
      [hoverScale]="1.1"
      [minScale]="0.95"
      [fullWidth]="false"
      [showHeader]="true"
      [headerTitle]="'Nuestras <span>Soluciones</span>'"
      [headerSubtitle]="'Descubre todo lo que Plaxtilineas tiene para ofrecerte'">
    </app-plaxti-banner>
  </section>

  <!-- Nuevos Productos -->
  <section class="home-section">
    <app-feature-new-products></app-feature-new-products>
  </section>

  <!-- Full Banner 2 -->
  <div class="full-banner-container">
    <app-full-banner
      [imageUrl]="'https://res.cloudinary.com/dsv1gdgya/image/upload/v1768343765/banner3-project_guqon6.png'"
      [description]="'Lonas de cerramiento y protección de alta resistencia, ideales para aplicaciones industriales.'"
      [vPosition]="'top'"
      [hPosition]="'left'"
      [linkUrl]="'/productos?subcategoria_id=11'"
      [subcategoriaId]="11">
    </app-full-banner>
  </div>

  <!-- Showcase Yumbolon -->
  <section class="home-section no-padding">
    <app-card-container
      [precio]="'$ 99.000'"
      [nombreProducto]="'YUMBOLON - THERMOLON'"
      [imagenProducto]="'https://res.cloudinary.com/dsv1gdgya/image/upload/v1767412446/card-template3_iwmedg.jpg'"
      [categoriaNombre]="'Yumbolon'"
      [bannerImagenUrl]="'https://res.cloudinary.com/dsv1gdgya/image/upload/v1767412449/feature5-project_zhqhxr.jpg'"
      [bannerTitulo]="'Yumbolon - Thermolon'"
      [bannerDescripcion]="'Material para aislamiento térmico ideal para obras, techos en PVC y aislamiento acústico.'"
      [bannerAltText]="'Banner de Yumbolon - Thermolon'"
      [promoTitulo]="'ENVIOS A PARTIR DE $70.000'"
      [promoDescripcion]="'Ventas por mas de $70.000 envíos gratis a todo el Quindio'"
      [promoImagen]="'https://res.cloudinary.com/dsv1gdgya/image/upload/v1768884810/envio3_qatfoe.jpg'"
      [promoLogoUrl]="''"
      [linkUrl]="['/productos']"
      [promoQueryParams]="{ subcategoria_id: 19 }"
      [cardLinkUrl]="['/productos']"
      [cardQueryParams]="{ subcategoria_id: 12 }">
    </app-card-container>
  </section>

  <!-- Grilla de Productos 2 -->
  <section class="home-section">
    <app-util-grid-producto-other></app-util-grid-producto-other>
  </section>

  <!-- Trio Presentation Servicios -->
  <section class="home-section">
    <app-plaxti-trio-presentation
      [cards]="serviciosCards"
      [showHeader]="true"
      [headerTitle]="'Nuestros Servicios'"
      [headerSubtitle]="'Soluciones integrales diseñadas para impulsar el crecimiento de tu empresa'"
      [backgroundColor]="'transparent'"
      [cardHeight]="'450px'"
      [gap]="'30px'"
      [hoverEffect]="true"
      [layout]="'alternate'">
    </app-plaxti-trio-presentation>
  </section>

  <!-- Ubicación y Partners -->
  <div class="footer-stack">
    <app-long-map></app-long-map>
    <app-social-buttons></app-social-buttons>
    <app-partners></app-partners>
    <app-footer></app-footer>
  </div>
</main>
